name: ci
on: [push, pull_request]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ocaml-variants.5.2.0+ox
          opam-repositories: |
            ox: https://github.com/oxcaml/opam-repository.git#afddc8337950dbc02863fe30ae58735a1cf2719f
            default: https://github.com/ocaml/opam-repository.git
      - run: opam pin add fixed-decimal https://github.com/winterchill-trading/fixed-decimal.git --no-action --yes
      - run: opam pin add exchange-core https://github.com/winterchill-trading/exchange-core.git --no-action --yes
      - run: opam pin add parquet https://github.com/winterchill-trading/parquet.git --no-action --yes
      - run: opam pin add market-data https://github.com/winterchill-trading/market-data.git --no-action --yes
      - run: opam pin add order-book https://github.com/winterchill-trading/order-book.git --no-action --yes
      - run: opam pin add exchange-core-engine https://github.com/winterchill-trading/exchange-core.git --no-action --yes
      - run: opam pin add venue-net https://github.com/winterchill-trading/venue-net.git --no-action --yes
      - run: opam pin add binance-protocol https://github.com/winterchill-trading/binance-protocol.git --no-action --yes
      - run: opam pin add mm-core https://github.com/winterchill-trading/mm-core.git --no-action --yes
      - run: opam pin add binance-sim https://github.com/winterchill-trading/binance-sim.git --no-action --yes
      - run: opam install . --deps-only --with-test
      - run: opam exec -- dune build
      - run: opam exec -- dune test
